    <!-- Smart PWA Domain Migration Script: Instant redirect for browsers, preserves standalone PWA for migration prompt -->
    <script>
      (function() {
        var legacyHost = 'dlmskvsulur.vercel.app';
        var targetHost = 'dlms.kvsulur.in';
        if (window.location.hostname === legacyHost) {
          var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                             window.navigator.standalone === true ||
                             document.referrer.indexOf('android-app://') !== -1;
          if (!isStandalone) {
            // Normal browser tab: instant zero-delay redirect
            var target = 'https://' + targetHost + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Library",
        "name": "KV Sulur Digital Library",
        "description": "Digital Library Management System for PM SHRI Kendriya Vidyalaya AFS Sulur.",

    <script>
      // Automatically recover when Vite chunk loading fails after a new deployment
      window.addEventListener('vite:preloadError', function(event) {
        event.preventDefault();
        window.location.reload();
      });

      // Capture beforeinstallprompt BEFORE React mounts — store globally so it's never lost
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        // Dispatch a custom event so React components can react even if already mounted
        window.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update().catch(function() {});
          }).catch(function() {});
        });
      }
    </script>
