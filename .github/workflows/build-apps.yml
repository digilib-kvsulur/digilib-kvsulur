name: Build & Release Native Apps (APK + EXE)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Android APK
  # ─────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
    outputs:
      apk_path: android/app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      # Inject KV logo into all Android mipmap + splash slots
      - name: Inject App Icons & Splash Screen
        run: node scripts/generate-android-icons.cjs

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      # Upload raw APK as artifact (accessible from Actions page without unzipping)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # Single file — GitHub will not zip it, you download the APK directly

  # ─────────────────────────────────────────────────
  # JOB 2: Windows EXE
  # ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build EXE
        run: npm run electron:build

      # Upload the installer EXE directly (nsis output is a single .exe)
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PM.SHRI.KV.SULUR.Digital.Library.Setup.1.0.0.exe
          path: dist-electron/*.exe
          # Single EXE file uploaded directly

  # ─────────────────────────────────────────────────
  # JOB 3: Publish to GitHub Release (runs after both)
  # ─────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk
          path: release-assets/android

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: PM.SHRI.KV.SULUR.Digital.Library.Setup.1.0.0.exe
          path: release-assets/windows

      - name: Rename EXE to consistent name
        run: |
          mv release-assets/windows/*.exe \
             "release-assets/windows/PM.SHRI.KV.SULUR.Digital.Library.Setup.1.0.0.exe" 2>/dev/null || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "KV Sulur DLMS - Latest Build"
          body: |
            ## KV Sulur Digital Library Management System
            **PM SHRI Kendriya Vidyalaya Sulur**

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🤖 Android | `app-debug.apk` |
            | 🪟 Windows | `PM.SHRI.KV.SULUR.Digital.Library.Setup.1.0.0.exe` |

            > Built automatically from the `main` branch on every push.
          files: |
            release-assets/android/app-debug.apk
            release-assets/windows/PM.SHRI.KV.SULUR.Digital.Library.Setup.1.0.0.exe
          prerelease: false
          make_latest: true
